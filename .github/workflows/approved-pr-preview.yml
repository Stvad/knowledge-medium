name: Deploy approved PR preview
run-name: "Preview PR #${{ inputs.pr_number }} at ${{ inputs.head_sha }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to preview (must target master)
        required: true
        type: string
      head_sha:
        description: Full 40-character head SHA reviewed and approved for deployment
        required: true
        type: string

permissions: {}
# A dispatch uses master's cache scope; PR code must not poison production caches.
cache-mode: none

concurrency:
  group: pr-preview-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.approve.outputs.number }}
      sha: ${{ steps.approve.outputs.sha }}
      repository: ${{ steps.approve.outputs.repository }}
      base-path: ${{ steps.approve.outputs.basePath }}
    steps:
      - name: Require the trusted workflow branch
        uses: actions/github-script@v8
        with:
          script: |
            if (context.ref !== 'refs/heads/master') {
              throw new Error('Run this workflow from master, not the PR branch');
            }
      - name: Checkout trusted approval code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate the approved PR head
        id: approve
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        with:
          script: |
            const { approvePreview } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/approved-pr-preview.ts`);
            const approved = await approvePreview({
              prNumber: process.env.PR_NUMBER, headSha: process.env.HEAD_SHA,
              repository: `${context.repo.owner}/${context.repo.repo}`,
              getPull: async number => (await github.rest.pulls.get({ ...context.repo, pull_number: number })).data,
            });
            for (const [key, value] of Object.entries(approved)) core.setOutput(key, value);

  build:
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      APP_BASE_PATH: ${{ needs.approve.outputs.base-path }}
      # These four values are PUBLIC client configuration, inlined into the bundle.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_POWERSYNC_URL: ${{ vars.VITE_POWERSYNC_URL || secrets.VITE_POWERSYNC_URL }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY || secrets.VITE_GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout only the approved commit
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.approve.outputs.repository }}
          ref: ${{ needs.approve.outputs.sha }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js without dependency caching
        uses: actions/setup-node@v6
        with:
          node-version: 26
          package-manager-cache: false
      - name: Validate public build configuration
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          test -n "$VITE_POWERSYNC_URL"
          test -n "$VITE_GOOGLE_MAPS_API_KEY"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the approved head
        env:
          # workflow_dispatch's GITHUB_SHA names master; stamp the PR head instead.
          APPROVED_HEAD_SHA: ${{ needs.approve.outputs.sha }}
        run: GITHUB_SHA="$APPROVED_HEAD_SHA" pnpm run build
      - name: Upload static preview files
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: approved-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  publish:
    needs: [approve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      pages: write
    env:
      APP_BASE_PATH: ${{ needs.approve.outputs.base-path }}
    steps:
      # This runner must never check out or execute the PR's scripts/dependencies.
      - name: Checkout trusted publishing code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download this build's artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - name: Revalidate approval and static artifact before publishing
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        with:
          script: |
            const { approvePreview, validatePreviewArtifact } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/approved-pr-preview.ts`);
            await approvePreview({
              prNumber: process.env.PR_NUMBER, headSha: process.env.HEAD_SHA,
              repository: `${context.repo.owner}/${context.repo.repo}`,
              getPull: async number => (await github.rest.pulls.get({ ...context.repo, pull_number: number })).data,
            });
            validatePreviewArtifact(`${process.env.GITHUB_WORKSPACE}/dist`);
      - name: Deploy approved preview
        id: deploy
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist/
          pr-number: ${{ needs.approve.outputs.number }}
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: deploy
          comment: false
      - name: Ensure Pages published
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ensure-pages-published.sh
      - name: Record approved commit on the PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ needs.approve.outputs.number }}
          header: pr-preview
          message: |
            ### Approved PR preview
            [Open preview](${{ steps.deploy.outputs.preview-url }})

            Approved commit: `${{ needs.approve.outputs.sha }}` (PR head, not a merge build).
            [Deployment run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · requested by @${{ github.actor }}.

            Later pushes do not update this preview. Run **Deploy approved PR preview** again to approve a new head.
