name: HTML frame CI diagnostic

on:
  push:
    branches: [codex/html-frame-ci-diagnostic]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Fetch comparison revisions
        run: git fetch --no-tags --depth=1 origin 5619b6e4be5d843800c5e90d75984b442dd051ac 35771148f1b9142df7b5cdc63cce4a0962593a46

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run alternating browser diagnostic
        run: python3 scripts/html-frame-diagnostic.py --rounds 5

      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-frame-diagnostic
          path: diagnostic-results/
          if-no-files-found: warn
