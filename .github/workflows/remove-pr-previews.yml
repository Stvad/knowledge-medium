name: Remove PR previews

# Removes pr-preview/pr-<n>/ from gh-pages for every PR that is no longer open,
# or that is open but has had no activity for PR_PREVIEW_IDLE_DAYS days (a
# repository variable, 30 when unset), for fork and same-repository PRs alike
# (scripts/sweep-pr-previews.ts). A close runs through pull_request_target
# because a `pull_request` workflow does not run at all while the PR has a merge
# conflict; the daily sweep catches anything a close still misses, and is what
# expires idle previews.

on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Also remove this PR's preview, even while the PR is open
        required: false
        type: string

permissions: {}
cache-mode: none

jobs:
  remove:
    runs-on: ubuntu-latest
    concurrency:
      # A close shares its PR's deploy group, so it waits out that PR's in-flight deploy.
      group: pr-preview-${{ github.event.pull_request.number || inputs.pr_number || 'sweep' }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      # The PR this run is about, if any: the closed PR, or the dispatch's pr_number.
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - name: Require the trusted workflow branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v8
        with:
          script: |
            if (context.ref !== 'refs/heads/master') {
              throw new Error('Run this workflow from master');
            }
      # pull_request_target is used ONLY for removal; never fetch the PR head.
      - name: Checkout trusted removal code
        uses: actions/checkout@v6
        with:
          ref: master
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
      # No ensure-pages-published.sh here: a removal whose Pages build fails goes
      # live with the next gh-pages push, since every build publishes the whole branch.
      # Also rewrites each expired PR's preview comment to say so, linking the redeploy steps.
      - name: Remove previews of closed and idle PRs
        env:
          GH_TOKEN: ${{ github.token }}
          # A close names no PR: the open-PR check decides, so a PR reopened since keeps its preview.
          FORCE_PR: ${{ inputs.pr_number }}
          PR_PREVIEW_IDLE_DAYS: ${{ vars.PR_PREVIEW_IDLE_DAYS }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node scripts/sweep-pr-previews.ts ${FORCE_PR:+"$FORCE_PR"}
      # A sweep leaves closed PRs' comments alone: it only catches a failed close run,
      # and a closed PR's stale link merely 404s. A close drops the link even if the PR
      # was reopened since; its next deploy posts it again.
      - name: Remove the preview link from the PR
        if: env.PR_NUMBER != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ env.PR_NUMBER }}
          header: pr-preview
          delete: true
