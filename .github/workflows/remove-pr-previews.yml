name: Remove PR previews

# Removes pr-preview/pr-<n>/ from gh-pages for every PR that is no longer open
# (scripts/sweep-pr-previews.ts), for fork and same-repository PRs alike. A close
# runs through pull_request_target because a `pull_request` workflow does not run
# at all while the PR has a merge conflict; the daily sweep catches anything a
# close still misses.

on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Also remove this PR's preview, even while the PR is open
        required: false
        type: string

permissions: {}
cache-mode: none

jobs:
  remove:
    runs-on: ubuntu-latest
    concurrency:
      # A close shares its PR's deploy group, so it waits out that PR's in-flight deploy.
      group: pr-preview-${{ github.event.pull_request.number || inputs.pr_number || 'sweep' }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require the trusted workflow branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v8
        with:
          script: |
            if (context.ref !== 'refs/heads/master') {
              throw new Error('Run this workflow from master');
            }
      # pull_request_target is used ONLY for removal; never fetch the PR head.
      - name: Checkout trusted removal code
        uses: actions/checkout@v6
        with:
          ref: master
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
      # No ensure-pages-published.sh here: a removal whose Pages build fails goes
      # live with the next gh-pages push, since every build publishes the whole branch.
      - name: Remove previews of closed PRs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node scripts/sweep-pr-previews.ts ${PR_NUMBER:+"$PR_NUMBER"}
      - name: Remove the preview link from the PR
        if: github.event_name == 'pull_request_target'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ github.event.pull_request.number }}
          header: pr-preview
          delete: true
