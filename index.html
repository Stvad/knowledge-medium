<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- interactive-widget=resizes-content shrinks the LAYOUT viewport when the on-screen keyboard opens, so the mobile editing toolbar (position:fixed; bottom:0) rides above the keyboard on Chromium (Chrome/Edge/Samsung) and Firefox. Safari ignores the key: there the layout viewport stays full-height and fixed elements are layout-anchored, so bottom:0 sits BEHIND the keyboard and the toolbar's bottom of calc(100% - keyboardTop) supplies the lift instead (src/utils/keyboardViewport.ts getKeyboardTop). Load-bearing for src/plugins/mobile-keyboard-toolbar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1e1b4b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Knowledge" />
    <meta name="application-name" content="Knowledge Medium" />
    <title>Knowledge medium</title>
    <script>
      // Resolve the persisted theme and its mode before paint so we don't
      // flash the default palette or the light `dark:` utilities. The
      // __KM_..._ tokens below are substituted at build/dev time
      // (vite-plugins/injectThemeBootDefaults.ts) with the values in
      // src/themeBootDefaults.ts, which the app itself uses. Unknown
      // stored values fall through to the :root defaults in
      // src/index.css until the theme-toggle style-sync effect injects
      // the matching rule; a stored id with no stored mode gets its mode
      // from that effect too.
      (function () {
        var root = document.documentElement
        try {
          var stored = window.localStorage.getItem("theme")
          if (stored) {
            root.dataset.theme = stored
            var storedMode = window.localStorage.getItem("theme-mode")
            if (storedMode) root.dataset.themeMode = storedMode
            return
          }
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          root.dataset.theme = prefersDark ? "sunset-warm-dark" : "sunset-warm-light"
          root.dataset.themeMode = prefersDark ? 'dark' : 'light'
        } catch (e) {
          root.dataset.theme = "sunset-warm-light"
          root.dataset.themeMode = 'light'
        }
      })()
    </script>
    <!-- Extensions import React and the app's own modules by bare specifier; both resolve to same-origin modules the build emits (src/vendor/react.js says why React needs its own facades). The React entries are every subpath React's packages export that runs in a browser, except react-dom/profiling (a second renderer); src/vendor/vendorEntries.test.ts derives that set. A specifier missing here does not resolve. -->

    <script type="importmap">
      {
        "imports": {
          "react": "./src/vendor/react.js",
          "react/jsx-runtime": "./src/vendor/react-jsx-runtime.js",
          "react/jsx-dev-runtime": "./src/vendor/react-jsx-dev-runtime.js",
          "react/compiler-runtime": "./src/vendor/react-compiler-runtime.js",
          "react-dom": "./src/vendor/react-dom.js",
          "react-dom/client": "./src/vendor/react-dom-client.js",
          "react-dom/server": "./src/vendor/react-dom-server.js",
          "react-dom/server.browser": "./src/vendor/react-dom-server.js",
          "react-dom/server.edge": "./src/vendor/react-dom-server-edge.js",
          "react-dom/static": "./src/vendor/react-dom-static.js",
          "react-dom/static.browser": "./src/vendor/react-dom-static.js",
          "react-dom/static.edge": "./src/vendor/react-dom-static-edge.js",
          "react-dom/test-utils": "./src/vendor/react-dom-test-utils.js",

          "@/": "./src/"
        }
      }
    </script>
    <script type="module" crossorigin src="/knowledge-medium/index.js"></script>

    <link rel="stylesheet" crossorigin href="/knowledge-medium/app.css">
